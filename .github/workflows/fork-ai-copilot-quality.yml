name: Fork AI Copilot Quality

on:
  push:
    branches:
      - research/ai-intent-policy-lazycode-20261016

permissions:
  contents: read

concurrency:
  group: ai-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline pytest (no Gemini key)
    if: github.repository == 'hue26ms23404-tech/hr-project-msa45hcm-group3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_secret_password
          POSTGRES_DB: hr_management_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_user -d hr_management_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_ENABLED: 'false'
      GEMINI_SEMANTIC_ENABLED: 'false'
      GEMINI_PUBLIC_SEARCH_ENABLED: 'false'
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: postgresql+asyncpg://hr_user:hr_secret_password@127.0.0.1:5432/hr_management_db
      SYNC_DATABASE_URL: postgresql+psycopg2://hr_user:hr_secret_password@127.0.0.1:5432/hr_management_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Prepare ephemeral PostgreSQL schema and synthetic seed data
        run: |
          python -m alembic upgrade head
          python -m app.scripts.seed_data
      - name: Compile AI code and tests
        run: python -m compileall -q app/ai app/services/ai_service.py app/services/ai_policy_answer.py app/services/ai_report_interpreter.py scripts/ai_semantic_live_eval.py tests/unit
      - name: Run offline unit regression tests
        run: python -m pytest -q tests/unit --disable-warnings --maxfail=10

  live-gemini:
    name: Gemini live semantic evaluation (opt-in)
    needs: offline-regression
    if: github.repository == 'hue26ms23404-tech/hr-project-msa45hcm-group3' && github.ref == 'refs/heads/research/ai-intent-policy-lazycode-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ai-research
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      AI_LIVE_TESTS_ENABLED: ${{ vars.AI_LIVE_TESTS_ENABLED }}
      GEMINI_ENABLED: 'true'
      GEMINI_SEMANTIC_ENABLED: 'true'
      GEMINI_PUBLIC_SEARCH_ENABLED: 'false'
      GEMINI_MODEL_NAME: ${{ vars.AI_GEMINI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check opt-in and Gemini environment readiness
        shell: bash
        working-directory: .
        run: |
          if [[ "$AI_LIVE_TESTS_ENABLED" != 'true' ]]; then
            echo "::notice::Live evaluation disabled. Set AI_LIVE_TESTS_ENABLED=true in repository or ai-research environment Variables."
            exit 0
          fi
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Missing GEMINI_API_KEY in ai-research environment Secrets."
            exit 1
          fi
          if [[ -z "$GEMINI_MODEL_NAME" ]]; then
            echo "::error::Missing AI_GEMINI_MODEL in repository or ai-research environment Variables."
            exit 1
          fi
          echo "Live test opt-in and model/secret presence verified (secret value never printed)."
      - uses: actions/checkout@v4
        if: env.AI_LIVE_TESTS_ENABLED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.AI_LIVE_TESTS_ENABLED == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        if: env.AI_LIVE_TESTS_ENABLED == 'true'
        run: python -m pip install -r requirements.txt
      - name: Evaluate Gemini planner on synthetic HR prompts
        if: env.AI_LIVE_TESTS_ENABLED == 'true'
        run: python -m scripts.ai_semantic_live_eval
